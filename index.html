<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Archivo</title>
    
    <!-- Configuración para parecer App nativa en iOS y Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mi Archivo">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        :root {
            --bg: #fdfdfc;
            --text: #222222;
            --muted: #666666;
            --border: #e0e0dc;
            --accent: #0055aa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background-color: var(--bg);
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem;
        }
        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 1.6rem; margin: 0 0 0.3rem 0; }
        p.subtitle { color: var(--muted); margin: 0; font-size: 0.95rem; }
        
        #buscador {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
        }

        .entrada {
            margin-bottom: 1.8rem;
            padding-bottom: 1.3rem;
            border-bottom: 1px solid var(--border);
        }
        .meta {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.25rem;
        }
        .etiqueta {
            background: #eeeeea;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 0.4rem;
        }
        h2 { font-size: 1.2rem; margin: 0.25rem 0 0.5rem 0; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nota { margin: 0.4rem 0 0 0; font-size: 0.95rem; }
    </style>
</head>
<body>

    <header>
        <h1>Mi Archivo Personal</h1>
        <p class="subtitle">Enlaces, lecturas y notas guardadas.</p>
    </header>

    <input type="text" id="buscador" placeholder="Buscar por título, nota o #etiqueta...">

    <main id="lista-archivo">
        
        <!-- INICIO DE ENTRADAS (Pega los nuevos bloques justo debajo de esta línea) -->

        <article class="entrada">
            <div class="meta">19 Nov 2026 <span class="etiqueta">#sistema</span> <span class="etiqueta">#archivo</span></div>
            <h2>Primer enlace guardado en mi archivo</h2>
            <p class="nota">Este portal ya funciona en web, Android y Apple. Edita este archivo en GitHub para añadir tus propios enlaces y textos.</p>
        </article>

    </main>

    <script>
        document.getElementById('buscador').addEventListener('input', function(e) {
            const texto = e.target.value.toLowerCase();
            const entradas = document.querySelectorAll('.entrada');
            entradas.forEach(entrada => {
                const contenido = entrada.textContent.toLowerCase();
                entrada.style.display = contenido.includes(texto) ? 'block' : 'none';
            });
        });
    </script>

</body>
</html>
