<!DOCTYPE html>
<html lang="ca">
<head>
<link rel="icon" type="image/png" href="logo.png?v=4">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca de butxaca ☁️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#d6f5f5; --bg2:#cfe8fb;
  --ink:#3d4a63; --soft:#7b89a3;
  --card:#ffffffcc; --line:#ffffff;
  --pink:#ffd1e3; --lilac:#e3d4ff; --peach:#ffe2c8; --mint:#c9f3dc; --lemon:#fff3b8; --sky:#cfe6ff;
  --accent:#ff9ec4; --accent-d:#e0709f;
  --radius:22px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); font-family:'Nunito',system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed; min-height:100vh;
}
body::before{ /* estrellitas de fondo */
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
  background-image:
    radial-gradient(circle,#fff 2px,transparent 3px),
    radial-gradient(circle,#ffffffaa 1.5px,transparent 2.5px);
  background-size:90px 90px,140px 140px; background-position:0 0,45px 60px;
}
.wrap{position:relative; max-width:1050px; margin:0 auto; padding:28px 18px 60px}
h1,h2,h3,.chip,button,.badge{font-family:'Fredoka',system-ui,sans-serif}
header{text-align:center; margin-bottom:22px}
header h1{font-size:clamp(1.8rem,5vw,2.8rem); margin:0; font-weight:600; letter-spacing:.3px}
header p{margin:6px 0 0; color:var(--soft)}
.stats{display:inline-flex; gap:10px; margin-top:12px; flex-wrap:wrap; justify-content:center}
.stat{background:var(--card); border:3px solid var(--line); border-radius:99px; padding:4px 14px; font-family:'Fredoka'; font-size:.9rem}

.panel{background:var(--card); border:3px solid var(--line); border-radius:var(--radius);
  padding:18px; margin-bottom:18px; box-shadow:0 6px 0 #ffffff88, 0 10px 24px #7fb7d433}
.panel > summary{cursor:pointer; font-family:'Fredoka'; font-size:1.2rem; list-style:none}
.panel > summary::-webkit-details-marker{display:none}
.panel > summary::after{content:" ＋"; color:var(--accent-d)}
.panel[open] > summary::after{content:" －"}

form{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:14px}
form .full{grid-column:1/-1}
label{display:block; font-family:'Fredoka'; font-size:.85rem; margin-bottom:4px; color:var(--soft)}
input,select,textarea{
  width:100%; font:inherit; color:var(--ink); background:#fff; border:2.5px solid #d8e6f3;
  border-radius:14px; padding:9px 12px; outline:none; transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 4px #ff9ec422}
textarea{resize:vertical; min-height:70px}
button{cursor:pointer; border:none; border-radius:99px; padding:9px 18px; font-size:1rem; color:#fff;
  background:var(--accent); box-shadow:0 4px 0 var(--accent-d); transition:transform .1s, box-shadow .1s}
button:hover{transform:translateY(1px); box-shadow:0 3px 0 var(--accent-d)}
button:active{transform:translateY(4px); box-shadow:none}
button.ghost{background:#fff; color:var(--ink); box-shadow:0 4px 0 #d8e6f3}
button.ghost:hover{box-shadow:0 3px 0 #d8e6f3}
:focus-visible{outline:3px solid var(--accent-d); outline-offset:2px}

.filters{display:grid; gap:12px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.row > .lbl{font-family:'Fredoka'; color:var(--soft); font-size:.85rem; min-width:78px}
.chip{border:2.5px solid #fff; border-radius:99px; padding:5px 13px; font-size:.92rem; background:#ffffffaa;
  color:var(--ink); box-shadow:none; cursor:pointer}
.chip:hover{transform:none; box-shadow:none; background:#fff}
.chip.on{background:var(--c,var(--pink)); border-color:#fff; box-shadow:0 0 0 2.5px var(--accent) }
.chip.tag{font-size:.82rem; padding:3px 10px}
.search{max-width:260px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.card{background:var(--card); border:3px solid #fff; border-radius:var(--radius); padding:16px;
  box-shadow:0 6px 0 #ffffff88, 0 10px 24px #7fb7d433; display:flex; flex-direction:column; gap:9px; position:relative}
.card.read{opacity:.72}
.card.read h3 a{text-decoration:line-through; text-decoration-color:var(--accent)}
.card h3{margin:0; font-size:1.1rem; font-weight:500; padding-right:34px; overflow-wrap:anywhere}
.card h3 a{color:inherit; text-decoration:none}
.card h3 a:hover{text-decoration:underline wavy var(--accent)}
.badges{display:flex; flex-wrap:wrap; gap:6px}
.badge{font-size:.78rem; padding:2px 10px; border-radius:99px; background:var(--c,var(--sky)); color:var(--ink)}
.tags{display:flex; flex-wrap:wrap; gap:5px}
.tags span{font-size:.8rem; color:var(--soft)}
.summary{margin:0; font-size:.95rem}
.notes{font-size:.9rem; background:var(--lemon); border-color:#fff7cf; min-height:56px}
.notes-l{margin:2px 0 -4px; font-size:.8rem}
.tick{position:absolute; top:12px; right:12px; width:30px; height:30px; padding:0; border-radius:50%;
  background:#fff; color:transparent; box-shadow:0 3px 0 #d8e6f3; font-size:1rem; display:grid; place-items:center}
.card.read .tick{background:var(--mint); color:#2f8f61; box-shadow:0 3px 0 #a6dfc1}
.foot{display:flex; justify-content:space-between; align-items:center; font-size:.78rem; color:var(--soft)}
.del{background:none; color:var(--soft); box-shadow:none; padding:2px 8px; font-size:.85rem}
.del:hover{color:#d0457a; box-shadow:none; transform:none}
.empty{grid-column:1/-1; text-align:center; padding:40px 10px; color:var(--soft); font-family:'Fredoka'; font-size:1.1rem}
.tools{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:26px}
.hint{font-size:.8rem; color:var(--soft); margin:6px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Biblioteca de butxaca ☁️</h1>
    <p>Jardí digital d'idees, lectures i troballes ✨</p>
    <div class="stats" id="stats"></div>
  </header>

  <section class="panel" id="login" hidden>
    <h2 style="margin-top:0">🔐 Entra a la teva biblioteca</h2>
    <form id="loginForm">
      <div><label for="l-mail">Correu</label><input id="l-mail" type="email" required autocomplete="username"></div>
      <div><label for="l-pass">Contrasenya</label><input id="l-pass" type="password" required autocomplete="current-password"></div>
      <div class="full"><button type="submit">Entrar 🌸</button> <span class="hint" id="loginMsg"></span></div>
    </form>
  </section>

  <div id="app" hidden>
  <details class="panel" id="addPanel" open>
    <summary>🍓 Afegir una lectura nova</summary>
    <form id="form" autocomplete="off">
      <div class="full"><label for="f-title">Títol *</label><input id="f-title" required maxlength="200" placeholder="Ex: Per què dormim"></div>
      <div class="full"><label for="f-url">Enllaç (https://…)</label><input id="f-url" placeholder="https://…"></div>
      <div class="full"><label for="f-file">…o puja un PDF (màx. 50 MB)</label><input id="f-file" type="file" accept="application/pdf,.pdf"></div>
      <div><label for="f-cat">Categoria *</label><select id="f-cat" required></select></div>
      <div><label for="f-prio">Per a què serveix</label><select id="f-prio"></select></div>
      <div><label for="f-src">Font</label><select id="f-src"></select></div>
      <div><label for="f-tags">Etiquetes (separades per comes)</label><input id="f-tags" placeholder="ansietat, somni, hàbits"></div>
      <div class="full"><label for="f-sum">Resum</label><textarea id="f-sum" placeholder="De què va, en dues línies…"></textarea></div>
      <div class="full"><button type="submit" id="saveBtn">Guardar 💾</button></div>
    </form>
  </details>

  <section class="panel filters" aria-label="Filtres">
    <div class="row"><span class="lbl">Categoria</span><div class="row" id="f-catChips"></div></div>
    <div class="row" id="tagRow"><span class="lbl">Etiquetes</span><div class="row" id="f-tagChips"></div></div>
    <div class="row"><span class="lbl">Tipus</span><div class="row" id="f-prioChips"></div></div>
    <div class="row"><span class="lbl">Font</span><div class="row" id="f-srcChips"></div></div>
    <div class="row">
      <span class="lbl">Estat</span>
      <div class="row" id="f-readChips"></div>
      <input class="search" id="q" type="search" placeholder="🔍 Cercar…" aria-label="Cercar">
    </div>
  </section>

  <main class="grid" id="list"></main>

  <div class="tools">
    <button class="ghost" id="logout">👋 Sortir</button>
    <button class="ghost" id="export">💾 Exportar còpia</button>
    <button class="ghost" id="importBtn">📂 Importar còpia</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== CONFIGURACIÓ: enganxa aquí les dades de Supabase ====== */
const SUPABASE_URL = 'https://qoboadphkpiqeamldwoj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LT0CHL8uJhoE55OZYZYAhg_-9nyJWzz';
/* ============================================================= */

const CATS = [
  {id:'psicologia', label:'🧠 Psicologia', c:'var(--pink)'},
  {id:'filosofia', label:'🦉 Filosofia', c:'var(--lilac)'},
  {id:'ia', label:'🤖 Intel·ligència artificial', c:'var(--sky)'},
  {id:'art', label:'🎨 Art / Literatura', c:'var(--peach)'},
  {id:'feina', label:'💼 Feina', c:'var(--lemon)'},
  {id:'creixement', label:'🌱 Creixement personal', c:'var(--mint)'}
];
const PRIOS = [
  {id:'rapida', label:'⚡ Lectura ràpida', c:'var(--lemon)'},
  {id:'analitzar', label:'🔍 Per analitzar', c:'var(--lilac)'},
  {id:'indagar', label:'🔮 Pendent d\'indagar', c:'var(--peach)'}
];
const SRCS = [
  {id:'noticia', label:'📰 Notícies', c:'var(--sky)'},
  {id:'article', label:'📄 Articles', c:'var(--pink)'},
  {id:'blog', label:'✍️ Blogs', c:'var(--mint)'},
  {id:'video', label:'🎬 Vídeo', c:'var(--peach)'}
];
const READ = [
  {id:'no', label:'📖 Per llegir', c:'var(--sky)'},
  {id:'si', label:'✅ Llegit', c:'var(--mint)'}
];

let sb = null, cfgProblem = null;
if(!window.supabase) cfgProblem = "No s'ha pogut carregar la llibreria de Supabase (comprova la connexió o si un bloquejador l'atura).";
else if(!/^https:\/\//.test(SUPABASE_URL) || SUPABASE_KEY.startsWith('PEGA')) cfgProblem = "Falta enganxar la URL i la clau de Supabase a les primeres línies de l'script.";
else { try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){ cfgProblem = 'Configuració de Supabase no vàlida: '+e.message; } }
let items = [], uid = null;
const F = {cat:null, tags:new Set(), prio:null, src:null, read:null, q:''};

const $ = s => document.querySelector(s);
const by = (arr,id) => arr.find(x=>x.id===id);
const el = (tag, props={}, kids=[]) => {
  const n = document.createElement(tag);
  Object.entries(props).forEach(([k,v])=>{
    if(k==='class') n.className=v; else if(k==='text') n.textContent=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else if(k==='style') n.style.cssText=v; else n.setAttribute(k,v);
  });
  kids.forEach(k=>n.append(k));
  return n;
};
const safeUrl = u => { u=(u||'').trim(); if(!u||/^(javascript|data|vbscript):/i.test(u)) return '#'; return u; };
const fail = (msg,err) => { console.error(err); alert(msg+(err&&err.message?'\n\n'+err.message:'')); };

/* ---------- dades ---------- */
async function load(){
  const {data,error} = await sb.from('lectures').select('*').order('created_at',{ascending:false});
  if(error) return fail('No s\'han pogut carregar les lectures.',error);
  items = data.map(r=>({...r, tags:r.tags||[], summary:r.summary||'', notes:r.notes||'', date:Date.parse(r.created_at)}));
  render();
}
async function patch(it, fields){
  Object.assign(it, fields);
  const {error} = await sb.from('lectures').update(fields).eq('id',it.id);
  if(error) fail('No s\'ha pogut desar el canvi.',error);
}
async function openFile(path){
  const w = window.open('','_blank');
  const {data,error} = await sb.storage.from('pdfs').createSignedUrl(path,3600);
  if(error){ if(w) w.close(); return fail('No s\'ha pogut obrir el PDF.',error); }
  if(w) w.location = data.signedUrl;
}

/* ---------- sessió ---------- */
function showSession(session){
  uid = session ? session.user.id : null;
  $('#login').hidden = !!session;
  $('#app').hidden = !session;
  if(session) load(); else items = [];
}
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  $('#loginMsg').textContent = '…';
  const {error} = await sb.auth.signInWithPassword({email:$('#l-mail').value.trim(), password:$('#l-pass').value});
  $('#loginMsg').textContent = error ? 'Correu o contrasenya incorrectes.' : '';
});
$('#logout').onclick = () => sb.auth.signOut();
if(cfgProblem){ $('#login').hidden = false; $('#loginMsg').textContent = '⚠️ '+cfgProblem; }
else sb.auth.onAuthStateChange((_ev,session)=>showSession(session));

/* ---------- formulari ---------- */
function fillSelect(sel, arr, withEmpty){
  sel.innerHTML='';
  if(withEmpty) sel.append(el('option',{value:'',text:'—'}));
  arr.forEach(o=>sel.append(el('option',{value:o.id,text:o.label})));
}
fillSelect($('#f-cat'),CATS); fillSelect($('#f-prio'),PRIOS,true); fillSelect($('#f-src'),SRCS,true);

$('#form').addEventListener('submit', async e=>{
  e.preventDefault();
  const url = $('#f-url').value.trim(), file = $('#f-file').files[0];
  if(!url && !file) return alert('Posa un enllaç o puja un PDF.');
  const btn = $('#saveBtn'); btn.disabled = true; btn.textContent = 'Guardant… ⏳';
  try{
    let file_path = null;
    if(file){
      if(file.size > 50*1024*1024) throw new Error('El PDF pesa més de 50 MB.');
      file_path = `${uid}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const up = await sb.storage.from('pdfs').upload(file_path, file, {contentType:file.type||'application/pdf'});
      if(up.error) throw up.error;
    }
    const tags = [...new Set($('#f-tags').value.split(',').map(t=>t.trim().replace(/^#/,'').toLowerCase()).filter(Boolean))];
    const {error} = await sb.from('lectures').insert({
      title:$('#f-title').value.trim(), url:url||null, file_path,
      cat:$('#f-cat').value, prio:$('#f-prio').value||null, src:$('#f-src').value||null,
      tags, summary:$('#f-sum').value.trim()
    });
    if(error) throw error;
    e.target.reset(); await load();
  }catch(err){ fail('No s\'ha pogut guardar.',err); }
  btn.disabled = false; btn.textContent = 'Guardar 💾';
});

/* ---------- filtres ---------- */
function chips(container, arr, key, allLabel){
  container.innerHTML='';
  const mk = (id,label,c) => el('button',{type:'button', class:'chip'+(F[key]===id?' on':''), style:'--c:'+(c||'#fff'),
    'aria-pressed':String(F[key]===id), text:label, onclick:()=>{F[key]=id; if(key==='cat') F.tags.clear(); render();}});
  container.append(mk(null,allLabel||'Tot','#fff'));
  arr.forEach(o=>container.append(mk(o.id,o.label,o.c)));
}
function visible(it){
  if(F.cat && it.cat!==F.cat) return false;
  if(F.prio && it.prio!==F.prio) return false;
  if(F.src && it.src!==F.src) return false;
  if(F.read && (F.read==='si') !== !!it.read) return false;
  for(const t of F.tags) if(!it.tags.includes(t)) return false;
  if(F.q){
    const h=(it.title+' '+it.summary+' '+it.notes+' '+it.tags.join(' ')).toLowerCase();
    if(!h.includes(F.q)) return false;
  }
  return true;
}

function render(){
  chips($('#f-catChips'),CATS,'cat','🌈 Totes');
  chips($('#f-prioChips'),PRIOS,'prio');
  chips($('#f-srcChips'),SRCS,'src');
  chips($('#f-readChips'),READ,'read');

  const pool = items.filter(i=>!F.cat || i.cat===F.cat);
  const all = [...new Set(pool.flatMap(i=>i.tags))].sort((a,b)=>a.localeCompare(b,'ca'));
  const tc = $('#f-tagChips'); tc.innerHTML='';
  all.forEach(t=>tc.append(el('button',{type:'button', class:'chip tag'+(F.tags.has(t)?' on':''), style:'--c:var(--lilac)',
    'aria-pressed':String(F.tags.has(t)), text:'#'+t, onclick:()=>{F.tags.has(t)?F.tags.delete(t):F.tags.add(t); render();}})));
  if(!all.length) tc.append(el('span',{class:'hint',text:'Encara no hi ha etiquetes aquí'}));

  const shown = items.filter(visible).sort((a,b)=>b.date-a.date);
  const list = $('#list'); list.innerHTML='';
  if(!shown.length) list.append(el('div',{class:'empty',text: items.length ? '(˘▾˘) Res amb aquests filtres' : '(◕‿◕) Afegeix la teva primera lectura!'}));
  shown.forEach(it=>list.append(card(it)));

  const done = items.filter(i=>i.read).length;
  $('#stats').innerHTML='';
  [`📚 ${items.length} guardades`,`✅ ${done} llegides`,`📖 ${items.length-done} pendents`].forEach(t=>$('#stats').append(el('span',{class:'stat',text:t})));
}

function card(it){
  const cat=by(CATS,it.cat), prio=by(PRIOS,it.prio), src=by(SRCS,it.src);
  const isPdf = !!it.file_path || /\.pdf($|\?|#)/i.test(it.url||'');
  const badges = el('div',{class:'badges'});
  if(cat) badges.append(el('span',{class:'badge',style:'--c:'+cat.c,text:cat.label}));
  if(prio) badges.append(el('span',{class:'badge',style:'--c:'+prio.c,text:prio.label}));
  if(src) badges.append(el('span',{class:'badge',style:'--c:'+src.c,text:src.label}));
  if(isPdf) badges.append(el('span',{class:'badge',style:'--c:var(--pink)',text:'📕 PDF'}));

  const a = it.file_path
    ? el('a',{href:'#', text:it.title, onclick:ev=>{ev.preventDefault(); openFile(it.file_path);}})
    : el('a',{href:safeUrl(it.url), target:'_blank', rel:'noopener noreferrer', text:it.title});
  const tick = el('button',{type:'button', class:'tick', title:it.read?'Marcar com a no llegit':'Marcar com a llegit',
    'aria-label':'Llegit', 'aria-pressed':String(!!it.read), text:'✓', onclick:async()=>{await patch(it,{read:!it.read}); render();}});

  const kids=[tick, el('h3',{},[a]), badges];
  if(it.tags.length) kids.push(el('div',{class:'tags'}, it.tags.map(t=>el('span',{text:'#'+t}))));
  if(it.summary) kids.push(el('p',{class:'summary',text:it.summary}));
  const nid='n'+it.id;
  kids.push(el('label',{class:'notes-l',for:nid,text:'📝 Les meves notes'}));
  const ta = el('textarea',{id:nid, class:'notes', placeholder:'Pensaments, cites, dubtes…'});
  ta.value = it.notes||'';
  let timer;
  ta.addEventListener('input',()=>{ it.notes=ta.value; clearTimeout(timer); timer=setTimeout(()=>patch(it,{notes:ta.value}),700); });
  kids.push(ta);
  kids.push(el('div',{class:'foot'},[
    el('span',{text:new Date(it.date).toLocaleDateString('ca')}),
    el('button',{type:'button',class:'del',text:'🗑️ Esborrar', onclick:async()=>{
      if(!confirm('Esborrar aquesta lectura?')) return;
      if(it.file_path) await sb.storage.from('pdfs').remove([it.file_path]);
      const {error} = await sb.from('lectures').delete().eq('id',it.id);
      if(error) return fail('No s\'ha pogut esborrar.',error);
      items = items.filter(x=>x!==it); render();
    }})
  ]));
  return el('article',{class:'card'+(it.read?' read':'')},kids);
}

$('#q').addEventListener('input',e=>{F.q=e.target.value.trim().toLowerCase(); render(); });

/* ---------- còpia de seguretat / migració ---------- */
$('#export').onclick=()=>{
  const out = items.map(({id,date,user_id,...r})=>r);
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=el('a',{href:URL.createObjectURL(b),download:'raconet-lectures.json'}); a.click(); URL.revokeObjectURL(a.href);
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{
  try{
    const data=JSON.parse(await e.target.files[0].text());
    if(!Array.isArray(data)) throw new Error('Format no vàlid');
    const rows = data.filter(i=>i&&i.title&&(i.url||i.file_path)).map(i=>({
      title:i.title, url:i.url||null, file_path:i.file_path||null, cat:i.cat||null, prio:i.prio||null, src:i.src||null,
      tags:Array.isArray(i.tags)?i.tags:[], summary:i.summary||'', notes:i.notes||'', read:!!i.read
    }));
    if(rows.length){ const {error}=await sb.from('lectures').insert(rows); if(error) throw error; }
    await load();
  }catch(err){ fail('Aquest fitxer no és una còpia vàlida.',err); }
  e.target.value='';
};
</script>
</body>
</html>
